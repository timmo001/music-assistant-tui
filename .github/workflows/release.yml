---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-linux-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@635f5727c8686b952f53d2fbe1d2e80d2480c831 # master
    with:
      binary-name: music-assistant-tui
      package-name: music-assistant-tui
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: 1.3.14
      smoke-test-arguments: --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        executable=./dist/release/root/music-assistant-tui
        completions=.scripts/linux/completions
        "$executable" completions bash > "$completions/music-assistant-tui.bash"
        "$executable" completions fish > "$completions/music-assistant-tui.fish"
        "$executable" completions zsh > "$completions/_music-assistant-tui"
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true

  prepare-aur:
    name: Prepare AUR package (music-assistant-tui)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}
      - name: Prepare music-assistant-tui
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .scripts/linux/prepare-aur-release.sh "$RELEASE_VERSION"
          "${{ runner.temp }}/aur-package"
      - name: Upload music-assistant-tui
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            aur-music-assistant-tui-${{
              github.run_id
            }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aur-package
          if-no-files-found: error
          retention-days: 1

  publish-aur:
    name: Publish AUR (music-assistant-tui)
    needs: prepare-aur
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@635f5727c8686b952f53d2fbe1d2e80d2480c831 # master
    with:
      package-name: music-assistant-tui
      artifact-name: >-
        aur-music-assistant-tui-${{
          github.run_id
        }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        music-assistant-tui.bash
        music-assistant-tui.fish
        _music-assistant-tui
        LICENSE
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
