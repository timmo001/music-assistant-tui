---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-linux-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      binary-name: music-assistant-tui
      package-name: music-assistant-tui
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      archive-extra-paths: sendspin-rs-cli
      bun-version: 1.4.2
      smoke-test-arguments: --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        case "$(uname -m)" in
          x86_64) sendspin_arch=amd64; sendspin_sha=25c21b91b6a0b87f4773f4d70bfc224176646dce49aeba0dc9f16c1f59d198c7 ;;
          aarch64) sendspin_arch=arm64; sendspin_sha=34772305890323a54506f0ec979ae1aeecc4da10bb7da47901dd799a1a737b20 ;;
          *) printf 'Unsupported architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
        esac
        curl --fail --location --silent --show-error \
          --output dist/release/root/sendspin-rs-cli \
          "https://github.com/s3than/sendspin-rs-cli/releases/download/v0.0.8/sendspin-rs-cli-linux-$sendspin_arch"
        printf '%s  %s\n' "$sendspin_sha" dist/release/root/sendspin-rs-cli \
          | sha256sum --check --strict
        chmod 0755 dist/release/root/sendspin-rs-cli
        executable=./dist/release/root/music-assistant-tui
        completions=.scripts/linux/completions
        "$executable" completions bash > "$completions/music-assistant-tui.bash"
        "$executable" completions fish > "$completions/music-assistant-tui.fish"
        "$executable" completions zsh > "$completions/_music-assistant-tui"
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (music-assistant-tui)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: music-assistant-tui
          pkgbuildTemplate: .scripts/linux/PKGBUILD.release
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "completions {shell}"
          extraFiles: |-
            LICENSE
            THIRD_PARTY_NOTICES.md

      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-music-assistant-tui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (music-assistant-tui)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      package-name: music-assistant-tui
      package-files-artifact-name: arch-music-assistant-tui-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (music-assistant-tui)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      package-name: music-assistant-tui

  publish-aur:
    name: Publish AUR (music-assistant-tui)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      package-name: music-assistant-tui
      artifact-name: arch-music-assistant-tui-${{ github.run_id }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        music-assistant-tui.bash
        music-assistant-tui.fish
        _music-assistant-tui
        LICENSE
        THIRD_PARTY_NOTICES.md
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
