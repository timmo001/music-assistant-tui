min_version = "2025.1.0"

[tools]
bun = "1.3.14"

[tasks.install]
description = "Install music-assistant-tui dependencies"
run = '''
if [ -n "${CI:-}" ]; then
  bun install --frozen-lockfile
else
  bun install
fi
'''

[tasks.dev]
description = "Run music-assistant-tui in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks."serve:start"]
description = "Start music-assistant-tui in a background terminal session"
depends = ["install"]
run = "termctrl start music-assistant-tui -- bun run src/index.ts"

[tasks."serve:status"]
description = "Show background terminal session status"
run = "termctrl status music-assistant-tui"

[tasks."serve:show"]
description = "Show the visible music-assistant-tui screen"
run = "termctrl show music-assistant-tui"

[tasks."serve:restart"]
description = "Restart the background terminal session"
run = "termctrl restart music-assistant-tui"

[tasks."serve:stop"]
description = "Stop the background terminal session"
run = "termctrl stop music-assistant-tui"

[tasks.build]
description = "Compile the music-assistant-tui binary"
depends = ["install"]
run = "bun run build"

[tasks.typecheck]
description = "Type-check the music-assistant-tui source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run the music-assistant-tui tests"
depends = ["install"]
run = "bun run test"

[tasks.format]
description = "Format the music-assistant-tui source"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Check formatting, types, tests and the production build"
depends = ["format:check", "typecheck", "test", "build", "shell:check", "package:check"]

[tasks."shell:check"]
description = "Check Linux packaging shell syntax"
run = "bun run check:shell"

[tasks."package:check"]
description = "Prepare the rolling AUR package metadata"
run = "bun run check:package"

[tasks.clean]
description = "Remove build and package artefacts"
run = "rm -rf build dist"

[tasks."package:arch"]
description = "Create an Arch Linux package"
depends = ["install"]
run = '''
rm -rf build dist
bun run build
VERSION="$(git describe --long --tags --abbrev=7 2>/dev/null || printf '0.1.0.r%s.g%s' "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)")"
VERSION="$(printf '%s' "$VERSION" | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')"
export VERSION
./.scripts/linux/create-arch.sh
'''
