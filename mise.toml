min_version = "2025.1.0"

[tools]
bun = "1.4.4"

[tasks.install]
description = "Install music-assistant-tui dependencies"
run = '''
if [ -n "${CI:-}" ]; then
  bun install --frozen-lockfile
else
  bun install
fi
'''

[tasks.dev]
description = "Run music-assistant-tui in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks."serve:start"]
description = "Start music-assistant-tui in a background terminal session"
depends = ["install"]
run = "termctrl start music-assistant-tui -- bun run src/index.ts"

[tasks."serve:status"]
description = "Show background terminal session status"
run = "termctrl status music-assistant-tui"

[tasks."serve:show"]
description = "Show the visible music-assistant-tui screen"
run = "termctrl show music-assistant-tui"

[tasks."serve:restart"]
description = "Restart the background terminal session"
run = "termctrl restart music-assistant-tui"

[tasks."serve:stop"]
description = "Stop the background terminal session"
run = "termctrl stop music-assistant-tui"

[tasks.build]
description = "Compile the music-assistant-tui binary"
depends = ["install"]
run = "bun run build"

[tasks."sendspin:download"]
description = "Download the pinned Sendspin player for the host architecture"
run = '''
mkdir -p dist
case "$(uname -m)" in
  x86_64) asset=amd64; checksum=99e683fd9f50538f5afb418faac98d6e37048ba9943ec492bf5e8b0d892789e2 ;;
  aarch64) asset=arm64; checksum=859c62d4dd1c3734d4b191ff878d6a7cedd86aa7b9ec5c53c82bd59094db0385 ;;
  *) printf 'Unsupported architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
esac
curl --fail --location --silent --show-error \
  --output dist/sendspin-rs-cli \
  "https://github.com/s3than/sendspin-rs-cli/releases/download/v0.0.10/sendspin-rs-cli-linux-$asset"
printf '%s  %s\n' "$checksum" dist/sendspin-rs-cli | sha256sum --check --strict
chmod 0755 dist/sendspin-rs-cli
'''

[tasks.typecheck]
description = "Type-check the music-assistant-tui source"
depends = ["install"]
run = "bun run typecheck"

[tasks.lint]
description = "Lint the music-assistant-tui source"
depends = ["install"]
run = "bun run lint"

[tasks.test]
description = "Run the music-assistant-tui tests"
depends = ["install"]
run = "bun run test"

[tasks.format]
description = "Format the music-assistant-tui source"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Check formatting, lint, types, tests and the production build"
depends = ["format:check", "lint", "typecheck", "test", "build", "shell:check", "package:check"]

[tasks."shell:check"]
description = "Check Linux packaging shell syntax"
run = "bun run check:shell"

[tasks."package:check"]
description = "Prepare the rolling AUR package metadata"
run = "bun run check:package"

[tasks.clean]
description = "Remove build and package artefacts"
run = "rm -rf build dist"

[tasks."package:arch"]
description = "Create an Arch Linux package"
depends = ["install", "sendspin:download"]
run = '''
rm -rf build
bun run build
VERSION="$(git describe --long --tags --abbrev=7 2>/dev/null || printf '%s.0.r%s.g%s' "$(git log -1 --format=%cd --date=format:%Y%m%d)" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)")"
VERSION="$(printf '%s' "$VERSION" | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')"
export VERSION
./.scripts/linux/create-arch.sh
'''
